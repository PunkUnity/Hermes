# Session compositor profile: Plasma/KWin.
requires = startplasma-wayland
socket = discovered
config-template = plasma-powerdevil-disabled.desktop
config-target = {runtime_dir}/xdg/autostart/powerdevil.desktop
env = KWIN_DRM_DEVICES={card_path},XDG_CONFIG_DIRS={runtime_dir}/xdg:/etc/xdg,XDG_CURRENT_DESKTOP=KDE,XDG_SESSION_DESKTOP=KDE,KDE_FULL_SESSION=true,KDE_SESSION_VERSION=6
command = dbus-run-session -- startplasma-wayland
